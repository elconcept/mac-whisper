name: Semantic Polish ASR Evaluation

on:
  push:
    branches: [main]
    paths:
      - "output/sample-pl.primary.reference.md"
      - "output/hypotheses/**"
      - "scripts/evaluate_semantic.py"
      - "scripts/primary_quality.py"
      - ".github/workflows/semantic-quality.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-asr-e5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vector-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only Torch and embedding encoder
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3"
          python -m pip install "sentence-transformers>=4,<6" "huggingface_hub>=0.35"
      - name: Cache public model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: polish-asr-embeddings-e5small-mmlwe5small-v1
      - name: Evaluate two embedding encoders against five real ASR transcripts
        run: |
          python scripts/evaluate_semantic.py \
            --models intfloat/multilingual-e5-small sdadas/mmlw-e5-small
      - name: Upload vector report regardless of Git push availability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polish-asr-semantic-quality
          path: output/semantic-quality.md
          retention-days: 30
          if-no-files-found: warn
      - name: Commit semantic report only (never overwrite manually corrected reference)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/semantic-quality.md
          if git diff --cached --quiet; then
            echo "No changed semantic scores"
          else
            git commit -m "data: evaluate Polish ASR with multilingual and Polish semantic embeddings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
