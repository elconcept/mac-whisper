name: Preserve real Polish transcripts in output

on:
  push:
    branches: [main]
    paths:
      - "scripts/archive_e2e_artifacts.py"
      - ".github/workflows/persist-transcriptions.yml"
  workflow_dispatch:
    inputs:
      source_run:
        description: "Completed authentic Polish E2E run ID to archive"
        required: true
        default: "40085977629"

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-polish-reference-main
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve successful model hypotheses
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run || '40085977629' }}
        run: |
          mkdir -p .ci-downloads
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir .ci-downloads
          python scripts/archive_e2e_artifacts.py .ci-downloads --run-id "$SOURCE_RUN"
      - name: Archive new authenticated Pyannote transcript and speaker timeline template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci-pyannote output/hypotheses
          gh run download 40089791275 --repo "$GITHUB_REPOSITORY" \
            --name authentic-pl-mlx-whisper-large-v3-turbo-pyannote --dir .ci-pyannote
          PYANNOTE_JSON="$(find .ci-pyannote -name sample-pl.json -type f | head -n 1)"
          PYANNOTE_REPORT="$(find .ci-pyannote -name '*.report.json' -type f | head -n 1)"
          test -s "$PYANNOTE_JSON"
          test -s "$PYANNOTE_REPORT"
          test ! -e output/hypotheses/mlx-whisper-large-v3-turbo-pyannote.json || exit 0
          cp "$PYANNOTE_JSON" output/hypotheses/mlx-whisper-large-v3-turbo-pyannote.json
          cp "$PYANNOTE_REPORT" output/hypotheses/mlx-whisper-large-v3-turbo-pyannote.report.json
          python scripts/create_speaker_reference.py
      - name: Commit machine outputs while retaining manual corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/hypotheses/*.json output/hypotheses/README.md
          if test -f output/sample-pl.speakers.template.json; then
            git add -f output/sample-pl.speakers.template.json
          fi
          if git diff --cached --quiet; then
            echo "No new model hypotheses; leaving reference unchanged"
          else
            git commit -m "data: archive real Polish ASR model outputs for human benchmark"
            git push origin HEAD:main
          fi
